---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: please-payment-cr-{{ .Values.envAlias }}
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec"]
  verbs: ["get", "create", "list"]
  
- apiGroups: ["batch"]
  resources: ["cronjobs", "jobs"]
  verbs: ["get", "create", "list", "patch"]
