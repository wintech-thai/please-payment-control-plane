apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: please-payment-noti-hub-ing
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.org/client-max-body-size: 50m
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - {{ .Values.pleasePaymentNotiHubDomain }}
  rules:
    - host: {{ .Values.pleasePaymentNotiHubDomain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: please-payment-{{ .Values.envGroup }}-noti-hub
                port:
                  number: 80
