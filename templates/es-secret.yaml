apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: es-user1
spec:
  refreshInterval: 1h          # rate SecretManager pulls GCPSM
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store     # name of the SecretStore (or kind specified)
  target:
    name: es-user1  # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
    - secretKey: "ES_USER"
      remoteRef:
        key: initial-secret
        property: ES_USER

    - secretKey: "ES_PASSWORD"
      remoteRef:
        key: initial-secret
        property: ES_PASSWORD

    - secretKey: "ES_ROLE"
      remoteRef:
        key: initial-secret
        property: ES_ROLE
