apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: misc-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: misc-secret       # name of the k8s Secret to be created
    creationPolicy: Owner
  data:
  - secretKey: MUTUAL_KEY
    remoteRef:
      key: "initial-secret-preset"
      property: MUTUAL_KEY
