onix-api:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 150m
        memory: 100Mi

    env:
      #- name: GOOGLE_APPLICATION_CREDENTIALS
      #  value: '/secrets/sa.json'

      #- name: STORAGE_BUCKET
      #  value: 'onix-v2-artifacts'

      - name: ENV_GROUP
        value: 'prod'

      # To solve ulimit(128) issue
      - name: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"

      - name: ASPNETCORE_ENVIRONMENT
        value: "Production"

      #- name: LOG_ENDPOINT
      #  value: "http://logstash-http.logstash-etl.svc.cluster.local:8080"

      - name: IsDev
        value: "false"

      #- name: ScanItem__RedirectUrl
      #  value: "https://verify.please-scan.com/verify"

      #- name: ScanItem__SymmetricKey
      #  valueFrom:
      #    secretKeyRef:
      #      name: scan-item-secret
      #      key: ENCRYPTION_KEY
      #      optional: false

      #- name: ScanItem__EncryptionIv
      #  valueFrom:
      #    secretKeyRef:
      #      name: scan-item-secret
      #      key: ENCRYPTION_IV
      #      optional: false

      - name: PostgreSQL__Host
        value: "postgresql-onix-v2"

      - name: PostgreSQL__Database
        value: "onix"

      - name: PostgreSQL__User
        value: "postgres"

      - name: PostgreSQL__Password
        valueFrom:
          secretKeyRef:
            name: onix-postgres-secret 
            key: adminPasswordKey
            optional: false

      - name: Redis__Host
        value: "redis-master"

      - name: Redis__Port
        value: "6379"

      - name: MINIO_ENDPOINT
        value: 'https://storage-api.please-payment.com'

      # เผื่อเอาไว้ให้คนที่เอา control plane ไปใช้สามารถ custom ได้เอง
      - name: MINIO_ENDPOINT_CUSTOM
        valueFrom:
          configMapKeyRef:
            name: storage-config
            key: MINIO_ENDPOINT_CUSTOM
            optional: true

      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-secret
            key: MINIO_ACCESS_KEY
            optional: false

      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-secret
            key: MINIO_SECRET_KEY
            optional: false

      - name: MINIO_BUCKET
        value: 'uploads-prod'

      - name: IS_NATIVE_IDP
        value: "true"

      - name: MUTUAL_KEY
        valueFrom:
          secretKeyRef:
            name: misc-secret
            key: MUTUAL_KEY
            optional: false
