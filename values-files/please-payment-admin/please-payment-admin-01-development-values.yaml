admin:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 100m
        memory: 100Mi

    env:
      - name: ENV_GROUP
        value: 'dev'

      - name: ENV_RUN
        value: 'Development'

      - name: NODE_ENV
        value: 'Development'

      - name: NEXT_PUBLIC_API_URL
        value: 'https://api-dev.please-payment.com'

      - name: BACKEND_URL
        value: 'http://please-payment-dev-onix-api'

      - name: NEXT_PUBLIC_PROVIDER_URL
        value: 'https://web-dev.dev-hubs.com'

      # เผื่อเอาไว้ให้คนที่เอา control plane ไปใช้สามารถ custom ได้เอง
      - name: CUSTOM_CHATBOT_DISABLE
        valueFrom:
          configMapKeyRef:
            name: custom-config
            key: CUSTOM_CHATBOT_DISABLE
            optional: true
